# Veröffentlicht den Ordner site/ über GitHub Pages.
# Läuft bei jedem Push: Das öffentliche Repository enthält seit 15.11.2026 nur noch die Webseite.
# Einmalig im Repository einstellen: Settings → Pages → Source: „GitHub Actions“.
# Die Seiten werden lokal erzeugt (cd app && npm run site) und mit eingecheckt; hier wird nichts gebaut.
# Hauptversionen der Actions am 11.11.2026 gegen github.com/actions/… geprüft (jeweils aktuellste).
name: Webseite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
